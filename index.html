<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Pictogramas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --primary-bg: #F0F9FF;
            --text-color: #334155;
        }
 
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
 
        .slide-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }
 
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* Se actualiza dinámicamente en JS para el color */
            opacity: 0;
            transform: translateX(100%) scale(0.95);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 1rem;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 8px solid white;
            padding: 1.5rem;
            overflow-y: auto;
        }
 
        .slide.active { opacity: 1; transform: translateX(0) scale(1); z-index: 10; }
        .slide.exit-left { opacity: 0; transform: translateX(-100%) scale(0.95); z-index: 5; }
        .slide.exit-right { opacity: 0; transform: translateX(100%) scale(0.95); z-index: 5; }
        .slide.enter-left { opacity: 0; transform: translateX(-100%) scale(0.95); }
 
        .nav-btn { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .nav-btn:active { transform: scale(0.92); }
 
        .pic-title {
            border-radius: 1.25rem;
            padding: 0.7rem 0.9rem;
            text-align: center;
            font-weight: 800;
            font-size: clamp(1rem, 4vw, 1.5rem);
            border: 3px solid;
            flex-shrink: 0;
        }
 
        .pic-frame {
            border-radius: 1.25rem;
            border: 3px solid;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            gap: 0.5rem;
        }
 
        .pic-frame .emoji { font-size: clamp(4rem, 20vw, 7.5rem); line-height: 1; }
        
        .pic-caption {
            font-weight: 800;
            font-size: clamp(0.85rem, 3.2vw, 1.05rem);
            flex-shrink: 0;
            text-align: center;
        }
 
        .pic-desc {
            border-radius: 1.25rem;
            border: 3px solid;
            padding: 0.7rem 0.9rem;
            text-align: center;
            font-weight: 700;
            font-size: clamp(0.75rem, 2.8vw, 0.95rem);
            line-height: 1.35;
            flex-shrink: 0;
        }
 
        .pic-rating {
            border-radius: 1.25rem;
            border: 3px solid #FDE68A;
            background: #FEF9E7;
            padding: 0.7rem 0.7rem 0.9rem;
            text-align: center;
            flex-shrink: 0;
        }
 
        .pic-rating .rating-label {
            font-weight: 800;
            color: #D97706;
            font-size: clamp(0.85rem, 3.2vw, 1.05rem);
            margin-bottom: 0.5rem;
        }
 
        .star-btn {
            background: none; border: none; padding: 0.2rem; cursor: pointer; transition: transform 0.15s ease;
        }
        .star-btn:active { transform: scale(0.85); }
        .star-btn svg { width: clamp(1.8rem, 7.5vw, 2.7rem); height: clamp(1.8rem, 7.5vw, 2.7rem); stroke: #F59E0B; stroke-width: 1.5; fill: none; transition: fill 0.15s ease; }
        .star-btn.filled svg { fill: #FBBF24; }
 
        #praise-toast {
            position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px) scale(0.9);
            background: #FFFFFF; border: 3px solid #FBBF24; color: #B45309; font-weight: 800;
            font-size: clamp(1.1rem, 5vw, 1.6rem); padding: 0.9rem 1.6rem; border-radius: 1.5rem;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.2); opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease; z-index: 50; text-align: center; white-space: nowrap;
        }
        #praise-toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        #dots-container { max-width: 60%; }

        .name-input {
            width: 90%;
            max-width: 400px;
            padding: 0.8rem 1.5rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            text-align: center;
            border: 4px dashed #86EFAC;
            border-radius: 1.5rem;
            margin-top: 1.5rem;
            outline: none;
            color: #166534;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            background: #F0FDF4;
            transition: border-color 0.3s ease;
        }
        .name-input:focus { border-color: #22C55E; background: #DCFCE7; }
        
        #touch-area { transition: max-width 0.5s ease, height 0.5s ease; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 sm:p-4">
 
    <header class="text-center mb-2 sm:mb-3 w-full max-w-lg">
        <h1 class="text-2xl sm:text-4xl font-extrabold text-blue-400 drop-shadow-sm tracking-wide">
            Mis Pictogramas
        </h1>
    </header>
 
    <main class="w-full max-w-xl sm:max-w-2xl relative mb-6" id="touch-area" style="height: min(85vh, 800px);">
        <div id="slide-container" class="slide-container"></div>
    </main>
 
    <div id="praise-toast"></div>
 
    <nav class="flex items-center justify-between w-full max-w-md sm:max-w-lg px-2" id="nav-container">
        <button id="prev-btn" class="nav-btn bg-pink-300 hover:bg-pink-400 text-white rounded-full p-3 shadow-lg shadow-pink-200 focus:outline-none" aria-label="Anterior">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 sm:h-12 sm:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
 
        <div id="dots-container" class="flex flex-wrap justify-center gap-1.5 sm:gap-2"></div>
 
        <button id="next-btn" class="nav-btn bg-green-400 hover:bg-green-500 text-white rounded-full p-3 shadow-lg shadow-green-200 focus:outline-none" aria-label="Siguiente">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 sm:h-12 sm:w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </nav>
 
    <script>
        const themes = {
            rojo: { bg: 'FECACA', text: 'B91C1C' },
            amarillo: { bg: 'FEF08A', text: 'A16207' },
            verde: { bg: 'BBF7D0', text: '15803D' },
            rojizo: { bg: 'FFE4E6', text: 'BE123C' } 
        };

        const pictograms = [
            { id: 1, img: "img/imagen1.png", theme: "amarillo", isCover: true, showStars: false },
            { id: 2, img: "img/imagen2.png", theme: "verde", isCover: true, showStars: false, needsNameInput: true, userName: "" },
            { id: 3, img: "img/imagen3.png", theme: "rojo", isCover: true, showStars: false },
            { id: 4, img: "img/imagen4.png", theme: "amarillo", isCover: true, showStars: false, smallImage: true },
            
            // Imagen 5: Reemplazada por Semáforo interactivo (isTrafficLight = true)
            { id: 5, topTitle: "Mis emociones", theme: "verde", isCover: true, showStars: false, isTrafficLight: true },
            
            { id: 6, title: "COSAS QUE NO DEBO HACER", caption: "¿QUÉ NO DEBO HACER?", desc: "Miro estas reglas y las practico todos los días", img: "img/imagen6.png", emoji: "🛑", theme: "rojizo", isCover: false, showStars: true, largeLayout: true, rating: 0 },
            { id: 7, title: "No pego", caption: "Manos quietas", desc: "Uso mis manos para jugar bonito.", img: "img/imagen7.png", emoji: "✋", theme: "rojo", isCover: false, showStars: true, rating: 0 },
            { id: 8, title: "No grito", caption: "Voz baja", desc: "Hablo con voz tranquila en el aula.", img: "img/imagen8.png", emoji: "🗣️", theme: "amarillo", isCover: false, showStars: true, rating: 0 },
            { id: 9, title: "No escupo", caption: "Boca limpia", desc: "Mi saliva se queda en mi boca.", img: "img/imagen9.png", emoji: "👄", theme: "verde", isCover: false, showStars: true, rating: 0 },
            { id: 10, title: "No empujo", caption: "Espero", desc: "Respeto el espacio de mis amigos.", img: "img/imagen10.png", emoji: "🚶", theme: "rojo", isCover: false, showStars: true, rating: 0 },
            { id: 11, title: "No tiro objetos", caption: "Cuido", desc: "Los juguetes se quedan en la mesa o el piso.", img: "img/imagen11.png", emoji: "🧸", theme: "amarillo", isCover: false, showStars: true, rating: 0 },
            { id: 12, title: "No corro", caption: "Despacio", desc: "Camino tranquilo dentro del salón.", img: "img/imagen12.png", emoji: "🚶", theme: "verde", isCover: false, showStars: true, rating: 0 },
            { id: 13, title: "No rompo materiales", caption: "Cuido mis cosas", desc: "Trato bien mis cuadernos y colores.", img: "img/imagen13.png", emoji: "🖍️", theme: "rojo", isCover: false, showStars: true, rating: 0 },
            { id: 14, title: "No molesto", caption: "Buen amigo", desc: "Juego bonito con mis compañeros.", img: "img/imagen14.png", emoji: "🫂", theme: "amarillo", isCover: false, showStars: true, rating: 0 },
            { id: 15, title: "No hago berrinche", caption: "Me calmo", desc: "Respiro profundo cuando me enojo.", img: "img/imagen15.png", emoji: "🧘", theme: "verde", isCover: false, showStars: true, rating: 0 },
            { id: 16, title: "Escucho", caption: "Presto atención", desc: "Escucho a mi profesora.", img: "img/imagen16.png", emoji: "👂", theme: "amarillo", isCover: false, showStars: true, rating: 0 },
            { id: 17, title: "Sigo indicaciones", caption: "Hago caso", desc: "Sigo las reglas con alegría.", img: "img/imagen17.png", emoji: "✅", theme: "verde", isCover: false, showStars: true, rating: 0 },
            { id: 18, title: "Respeto", caption: "Soy amable", desc: "Digo por favor y gracias.", img: "img/imagen18.png", emoji: "🙏", theme: "rojo", isCover: false, showStars: true, rating: 0 },
            { id: 19, title: "Comparto", caption: "Juego juntos", desc: "Comparto mis juguetes.", img: "img/imagen19.png", emoji: "🤝", theme: "amarillo", isCover: false, showStars: true, rating: 0 },
            { id: 20, title: "Sonrío", caption: "Estoy feliz", desc: "Disfruto mi día en la escuela.", img: "img/imagen20.png", emoji: "😊", theme: "verde", isCover: false, showStars: true, rating: 0 }
        ];
 
        const PRAISE_MESSAGES = ["¡Perfecto! 🌟", "¡Magnífico! 🎉", "¡Muy bien! 👏"];
        let currentIndex = 0;
        let isAnimating = false;
 
        const container = document.getElementById('slide-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const dotsContainer = document.getElementById('dots-container');
        const praiseToast = document.getElementById('praise-toast');
        const touchAreaEl = document.getElementById('touch-area');
        const navContainer = document.getElementById('nav-container');
 
        function showPraise() {
            const msg = PRAISE_MESSAGES[Math.floor(Math.random() * PRAISE_MESSAGES.length)];
            praiseToast.textContent = msg;
            praiseToast.classList.add('show');
            clearTimeout(showPraise._t);
            showPraise._t = setTimeout(() => { praiseToast.classList.remove('show'); }, 1800);
        }
 
        function buildStars(item, starsWrap) {
            starsWrap.innerHTML = '';
            let current = item.rating || 0; 
            
            function render() {
                Array.from(starsWrap.children).forEach((btn, idx) => {
                    btn.classList.toggle('filled', idx < current);
                });
            }
            
            for (let i = 1; i <= 5; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'star-btn';
                btn.setAttribute('aria-label', `Calificar ${i} estrellas`);
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.3 6.6L12 16.9l-5.9 3.5 1.3-6.6-4.9-4.5 6.6-.7z" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
                btn.addEventListener('click', () => {
                    current = i;
                    item.rating = current; 
                    render();
                    if (current === 5) showPraise();
                });
                starsWrap.appendChild(btn);
            }
            render();
        }
 
        function createSlideElement(item, directionClass = 'enter-right') {
            const slide = document.createElement('div');
            const theme = themes[item.theme] || themes.amarillo; 
            
            slide.className = `slide ${directionClass}`;
            
            if (item.theme === 'rojizo') {
                slide.style.backgroundColor = `#${theme.bg}`;
                slide.style.borderColor = `#${theme.text}`;
            } else {
                slide.style.backgroundColor = `white`;
                slide.style.borderColor = `#${theme.bg}`;
            }

            if (item.isCover) {
                slide.style.borderWidth = '0';
            }
 
            // Control Especial para Imagen 5 (Semáforo de emociones interactivo)
            if (item.isTrafficLight) {
                // Configuramos los colores exactos de los botones
                const btnsConfig = [
                    { id: 'btn-verde', baseColor: '#4CAF50', bgColor: '#E8F5E9', borderColor: '#4CAF50', title: 'VERDE', text: 'Estoy tranquilo. Puedo aprender.', sound: 'sonido_verde.mp3', flashColor: '#BBEAA6' },
                    { id: 'btn-amarillo', baseColor: '#FFEB3B', bgColor: '#FFF9C4', borderColor: '#FBC02D', title: 'AMARILLO', text: 'Me estoy molestando. Necesito apoyo.', sound: 'sonido_amarillo.mp3', flashColor: '#FEF08A' },
                    { id: 'btn-rojo', baseColor: '#F44336', bgColor: '#FFEBEE', borderColor: '#F44336', title: 'ROJO', text: 'Estoy en crisis. Necesito ayuda ya.', sound: 'sonido_rojo.mp3', flashColor: '#FECACA' }
                ];

                let slideHTML = `<div class="pic-frame" style="background-color:transparent; border:none; padding:0 1rem; height:100%; width:100%; box-shadow: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem;">`;
                
                if (item.topTitle) {
                    slideHTML += `<h2 class="text-3xl sm:text-5xl font-extrabold text-center mb-2" style="color: #${theme.text}; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">${item.topTitle}</h2>`;
                }

                btnsConfig.forEach(btn => {
                    slideHTML += `
                    <button class="semaforo-btn w-full max-w-sm rounded-xl border-4 flex items-center p-3 sm:p-4 text-left transition-transform active:scale-95" 
                            style="background-color: ${btn.bgColor}; border-color: ${btn.borderColor};"
                            data-flash="${btn.flashColor}" data-sound="${btn.sound}">
                        <div class="rounded-full border-[3px] border-black flex-shrink-0" style="background-color: ${btn.baseColor}; width: 65px; height: 65px; margin-right: 1.25rem;"></div>
                        <div>
                            <div class="font-extrabold text-2xl tracking-wide uppercase" style="color: #111827;">${btn.title}</div>
                            <div class="font-bold text-sm sm:text-base text-gray-800 leading-tight mt-0.5">${btn.text}</div>
                        </div>
                    </button>
                    `;
                });

                slideHTML += `</div>`;
                slide.innerHTML = slideHTML;

                // Lógica de interacción del semáforo
                const semaforoBtns = slide.querySelectorAll('.semaforo-btn');
                const originalBg = slide.style.backgroundColor;
                // Agregamos una transición suave al fondo del slide
                slide.style.transition = 'background-color 0.4s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)'; 

                semaforoBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const flashColor = this.getAttribute('data-flash');
                        const soundFile = this.getAttribute('data-sound');
                        
                        // 1. Cambiar el fondo
                        slide.style.backgroundColor = flashColor;
                        
                        // 2. Reproducir el sonido
                        const audio = new Audio(soundFile);
                        audio.play().catch(e => console.log('Aún no has agregado el archivo: ' + soundFile));
                        
                        // 3. Regresar el color a la normalidad después de 1.6 segundos
                        setTimeout(() => {
                            slide.style.backgroundColor = originalBg;
                        }, 1600);
                    });
                });

                return slide;
            }

            let imgStyles = "border-radius: 0.5rem;";
            if (item.smallImage) {
                imgStyles += " max-height: 55%; width: auto; object-fit: contain; margin: 0 auto;";
            } else {
                imgStyles += " width: 100%; height: 100%; max-height: 100%; object-fit: contain;";
            }

            const pictureHTML = item.img
                ? `<img src="${item.img}" style="${imgStyles}" alt="${item.caption || 'Imagen'}" onerror="this.outerHTML='<span class=\\'emoji\\' style=\\'user-select: none;\\'>${item.emoji || '🖼️'}</span>'">`
                : `<span class="emoji" style="user-select: none;">${item.emoji || '🖼️'}</span>`;

            let slideHTML = '';

            if (item.isCover) {
                slideHTML = `<div class="pic-frame" style="background-color:transparent; border:none; padding:1rem; height:100%; width:100%; box-shadow: none; display: flex; flex-direction: column; justify-content: center; align-items: center;">`;
                
                if (item.topTitle) {
                    slideHTML += `<h2 class="text-3xl sm:text-5xl font-extrabold text-center mb-6" style="color: #${theme.text}; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">${item.topTitle}</h2>`;
                }

                slideHTML += pictureHTML;

                if (item.needsNameInput) {
                    slideHTML += `<input type="text" class="name-input" placeholder="Escribe tu nombre aquí" value="${item.userName || ''}">`;
                }

                slideHTML += `</div>`;
            } else {
                const innerBg = item.theme === 'rojizo' ? 'FFFFFF' : `${theme.bg}44`;

                slideHTML = `
                    <div class="pic-title" style="background-color:#${item.theme === 'rojizo' ? 'FFFFFF' : theme.bg}; border-color:#${theme.text}; color:#${theme.text};">
                        ${item.title}
                    </div>
                    <div class="pic-frame" style="background-color:#${innerBg}; border-color:#${item.theme === 'rojizo' ? theme.text : theme.bg};">
                        ${pictureHTML}
                        ${item.caption ? `<div class="pic-caption" style="color:#${theme.text};">${item.caption}</div>` : ''}
                    </div>
                    <div class="pic-desc" style="background-color:#${innerBg}; border-color:#${item.theme === 'rojizo' ? theme.text : theme.bg}; color:#${theme.text};">
                        ${item.desc}
                    </div>
                `;

                if (item.showStars) {
                    slideHTML += `
                        <div class="pic-rating">
                            <div class="rating-label">¡Lo estoy logrando!</div>
                            <div class="stars-wrap flex items-center justify-center gap-1"></div>
                        </div>
                    `;
                }
            }

            slide.innerHTML = slideHTML;
 
            if (item.needsNameInput) {
                const inputEl = slide.querySelector('.name-input');
                if (inputEl) {
                    inputEl.addEventListener('input', (e) => {
                        item.userName = e.target.value;
                    });
                }
            }

            if (item.showStars && !item.isCover) {
                const starsWrap = slide.querySelector('.stars-wrap');
                buildStars(item, starsWrap);
            }
 
            return slide;
        }
 
        function updateDots() {
            dotsContainer.innerHTML = '';
            pictograms.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 sm:w-3 sm:h-3 rounded-full transition-all duration-300 ${index === currentIndex ? 'bg-blue-500 scale-125' : 'bg-gray-300'}`;
                dotsContainer.appendChild(dot);
            });
        }
 
        function goToSlide(newIndex, direction) {
            if (isAnimating || newIndex === currentIndex) return;
            isAnimating = true;
 
            if (pictograms[newIndex].largeLayout) {
                touchAreaEl.classList.remove('max-w-xl', 'sm:max-w-2xl');
                touchAreaEl.classList.add('max-w-3xl', 'sm:max-w-5xl');
                touchAreaEl.style.height = 'min(92vh, 950px)';
                navContainer.classList.remove('max-w-md', 'sm:max-w-lg');
                navContainer.classList.add('max-w-xl', 'sm:max-w-3xl');
            } else {
                touchAreaEl.classList.add('max-w-xl', 'sm:max-w-2xl');
                touchAreaEl.classList.remove('max-w-3xl', 'sm:max-w-5xl');
                touchAreaEl.style.height = 'min(85vh, 800px)';
                navContainer.classList.add('max-w-md', 'sm:max-w-lg');
                navContainer.classList.remove('max-w-xl', 'sm:max-w-3xl');
            }

            const currentSlide = container.querySelector('.active');
            const newSlide = createSlideElement(pictograms[newIndex], direction === 'next' ? 'slide' : 'enter-left');
 
            container.appendChild(newSlide);
            void newSlide.offsetWidth;
 
            if (currentSlide) {
                currentSlide.classList.remove('active');
                currentSlide.classList.add(direction === 'next' ? 'exit-left' : 'exit-right');
            }
 
            newSlide.classList.remove('enter-left');
            newSlide.classList.add('active');
 
            currentIndex = newIndex;
            updateDots();
 
            setTimeout(() => {
                if (currentSlide) currentSlide.remove();
                isAnimating = false;
            }, 600);
        }
 
        function nextSlide() {
            const nextIndex = (currentIndex + 1) % pictograms.length;
            goToSlide(nextIndex, 'next');
        }
 
        function prevSlide() {
            const prevIndex = (currentIndex - 1 + pictograms.length) % pictograms.length;
            goToSlide(prevIndex, 'prev');
        }
 
        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);
 
        let touchStartX = 0;
        let touchEndX = 0;
 
        touchAreaEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        touchAreaEl.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) nextSlide();
            if (touchEndX > touchStartX + swipeThreshold) prevSlide();
        }, { passive: true });
 
        const initialSlide = createSlideElement(pictograms[0], 'active');
        container.appendChild(initialSlide);
        updateDots();
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
    </script>
</body>
</html>
